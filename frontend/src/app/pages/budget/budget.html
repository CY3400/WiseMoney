<div class="center-page">
    @if(hasErrors()) {
        <div class="error border-danger">
            @if(errors.amount) {
                <span class="text-danger">{{ errors.amount }}</span>
            }
        </div>
    }

    <div class="budget-card">
        <h2 class="page-title">Budget</h2>
        <p class="page-subtitle">{{total == 0 ? 'Ajoutez votre budget mensuel' : 'Modifiez votre budget mensuel'}}</p>
        <form #form="ngForm" (ngSubmit)="total == 0 ? onSubmit(form) : onUpdate(form)">
            <div class="field-group">
                <label for="budget" [class.text-danger]="errors.amount">Montant du Budget</label>
                <input [disabled]="isSubmitting" id="budget" name="budget" type="text" [(ngModel)]="budget.amount" class="form-control" [class.border-danger]="errors.amount" (keydown)="common.validateNextValueKeydown($event,numberRegex,allowedKeys)" (paste)="common.validateNextValuePaste($event,numberRegex)"/>
            </div>

            <div class="actions">
                @if(total == 0) {
                    <button class="primary" type="submit" [disabled]="isSubmitting" [attr.aria-busy]="isSubmitting">{{ isSubmitting ? 'Ajout...' : 'Ajouter'}}</button>
                }
                @else {
                    <button class="secondary" type="button" (click)="onUpdate(form)" [disabled]="isSubmitting" [attr.aria-busy]="isSubmitting">{{ isSubmitting ? 'Modification...' : 'Modifier'  }}</button>
                }
            </div>
        </form>
    </div>
</div>
